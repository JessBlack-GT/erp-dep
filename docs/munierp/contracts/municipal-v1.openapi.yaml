openapi: 3.1.0
info:
  title: MuniERP IA — API municipal conectada a YJ Nexo ERP
  version: 1.0.0-draft.2
  description: |
    Propuesta versionada. Fuente de verdad para `apps/backend/src/modules/municipal`.
    Estado: BORRADOR. La capa de aplicación y la política de acceso están implementadas y probadas
    en memoria, pero la API **no está montada**: montarla requiere revisión de Codex (C-01).

    Cambios draft.2 (2026-11-09, F1-04 capa HTTP aislada):
    - Implementación HTTP en `modules/municipal/http/` sobre Express aislado; 19 operaciones
      implementadas y 5 marcadas `x-status: pending` (F1-12) que responden 501 tras autenticar.
    - Respuestas 401/503 en todas las operaciones (identidad central del ERP); códigos de error
      INTERNAL_ERROR y NOT_IMPLEMENTED; campo opcional `fields` en errores de validación.
    - ETag (versión) en createRequest/getRequest/updateRequest/transitionRequest; If-Match en PATCH.
    - Esquemas de respuesta explícitos: Citizen, Grant, AuditEvent; RequestSummary con `subject`
      opcional (omitido para alcance META); historial con acción EDITAR y `fields`.
    - getRequest usa anyOf (Request | RequestSummary).
    - Cabecera X-Request-Id: se acepta del cliente si es válida o se genera; se devuelve siempre.
    - Parámetros de consulta desconocidos → 400.

    Cambios draft.1 (2026-10-26, requisitos oficiales RQ01–RQ06):
    - `channel` obligatorio en RequestCreate (RQ06) y visible en RequestSummary.
    - Acción `ASIGNAR` y permiso `municipal.requests.assignUser` (RQ02).
    - Nuevas operaciones: getRequestHistory (RQ02), getRequestReceipt (RQ06),
      uploadDocument / listDocuments / downloadDocument (RQ05), getIndicators (RQ04).
    - Código de error PAYLOAD_TOO_LARGE (413) para documentos.
    - `x-rq` en cada operación para trazabilidad.

    Reglas transversales:
    - Autenticación: el mismo JWT de acceso de YJ Nexo (`POST /api/v1/auth/login`).
    - Autorización: membresía municipal activa + permiso `municipal.*` + alcance por expediente.
      Los roles ERP (incluido superadmin) no conceden acceso municipal.
    - `municipalityId`, `folio`, `createdBy`, `history` y contadores nunca se aceptan del cliente.
    - Objetos fuera de alcance responden 404 (no 403) para no revelar existencia.
    - Payloads con campos desconocidos responden 400.
    - Solo datos sintéticos en QA.
servers:
  - url: /api/municipal/v1
security:
  - bearerAuth: []

paths:
  /me/memberships:
    get:
      summary: Membresías municipales vigentes del usuario autenticado
      operationId: listMyMemberships
      x-rq: [RQ05]
      description: Requiere solo JWT válido y usuario activo. Devuelve lista vacía si no hay membresías (la UI oculta el módulo).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MyMembership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /municipalities/{mun}/dependencies:
    parameters: [ { $ref: '#/components/parameters/Mun' } ]
    get:
      summary: Listar dependencias del municipio
      operationId: listDependencies
      x-rq: [RQ03]
      x-permission: municipal.dependencies.read
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ActiveStatus' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Dependency' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      summary: Crear dependencia
      operationId: createDependency
      x-status: pending
      x-pending-story: F1-12
      x-rq: [RQ05]
      x-permission: municipal.dependencies.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DependencyCreate' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Dependency' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /municipalities/{mun}/dependencies/{code}:
    parameters:
      - { $ref: '#/components/parameters/Mun' }
      - { $ref: '#/components/parameters/DepCode' }
    patch:
      summary: Actualizar nombre/estado de una dependencia (el código es inmutable)
      operationId: updateDependency
      x-status: pending
      x-pending-story: F1-12
      x-rq: [RQ05]
      x-permission: municipal.dependencies.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DependencyUpdate' }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /municipalities/{mun}/memberships:
    parameters: [ { $ref: '#/components/parameters/Mun' } ]
    get:
      summary: Listar membresías
      operationId: listMemberships
      x-status: pending
      x-pending-story: F1-12
      x-rq: [RQ05]
      x-permission: municipal.memberships.read
      x-scope: TITULAR solo ve membresías de sus dependencias
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '501': { $ref: '#/components/responses/NotImplemented' }
    post:
      summary: Asignar un usuario existente de YJ Nexo al municipio
      operationId: createMembership
      x-status: pending
      x-pending-story: F1-12
      x-rq: [RQ05]
      x-permission: municipal.memberships.manage
      description: |
        No crea usuarios ni cambia `User.role`. El rol asignado debe ser subconjunto de los
        permisos del actor; no puede asignarse a sí mismo ni crear ADMIN_MUNICIPAL.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipCreate' }
      responses:
        '201': { description: Creada }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /municipalities/{mun}/memberships/{membershipId}:
    parameters:
      - { $ref: '#/components/parameters/Mun' }
      - { name: membershipId, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
    patch:
      summary: Cambiar rol, dependencias, vigencia o estado de una membresía
      operationId: updateMembership
      x-status: pending
      x-pending-story: F1-12
      x-rq: [RQ05]
      x-permission: municipal.memberships.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipUpdate' }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /municipalities/{mun}/citizens:
    parameters: [ { $ref: '#/components/parameters/Mun' } ]
    post:
      summary: Registrar ciudadano solicitante (NO es un cliente comercial)
      operationId: createCitizen
      x-rq: [RQ01, RQ06]
      x-permission: municipal.citizens.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CitizenCreate' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Citizen' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      summary: Buscar ciudadanos (solo los vinculados a expedientes en alcance, o creados por el actor)
      operationId: searchCitizens
      x-rq: [RQ03]
      x-permission: municipal.citizens.read
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 3, maxLength: 80 } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Citizen' } }
                      pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /municipalities/{mun}/requests:
    parameters: [ { $ref: '#/components/parameters/Mun' } ]
    post:
      summary: Registrar solicitud y emitir folio
      operationId: createRequest
      x-rq: [RQ01, RQ06]
      x-permission: municipal.requests.create
      description: |
        Emite el folio dentro de la misma transacción que crea el documento y el evento de bitácora.
        Reintentos con la misma `Idempotency-Key` y el mismo cuerpo devuelven el mismo folio (200);
        con cuerpo distinto, 409.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,100}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestCreate' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Request' } }
        '200': { description: Reintento idempotente; mismo recurso }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      summary: Listar solicitudes en alcance
      operationId: listRequests
      x-rq: [RQ03]
      x-permission: municipal.requests.read
      description: El filtro de alcance se aplica en la consulta; los filtros del cliente solo pueden reducirlo.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RequestStatus' } }
        - { name: dependency, in: query, schema: { $ref: '#/components/schemas/DependencyCode' } }
        - { name: assignedToMe, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/RequestSummary' } }
                      pagination: { $ref: '#/components/schemas/Pagination' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /municipalities/{mun}/requests/{folio}:
    parameters:
      - { $ref: '#/components/parameters/Mun' }
      - { $ref: '#/components/parameters/Folio' }
    get:
      summary: Consultar expediente por folio
      operationId: getRequest
      x-rq: [RQ03]
      x-permission: municipal.requests.read
      responses:
        '200':
          description: OK (AUDITOR recibe RequestSummary)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      data:
                        anyOf:
                          - $ref: '#/components/schemas/Request'
                          - $ref: '#/components/schemas/RequestSummary'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      summary: Editar asunto/descripción/confidencialidad (no estado, no folio)
      operationId: updateRequest
      x-rq: [RQ02]
      x-permission: municipal.requests.update
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string }, description: 'Valor `version` vigente; 409 si cambió' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestUpdate' }
      responses:
        '200':
          description: OK (nueva versión en ETag)
          headers:
            ETag: { schema: { type: string }, description: Versión vigente entre comillas }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Request' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /municipalities/{mun}/requests/{folio}/transitions:
    parameters:
      - { $ref: '#/components/parameters/Mun' }
      - { $ref: '#/components/parameters/Folio' }
    post:
      summary: Cambiar estado o responsable (turnar, asignar, esperar ciudadano, reanudar, cerrar, cancelar)
      operationId: transitionRequest
      x-rq: [RQ02]
      x-permission-by-action:
        TURNAR: municipal.requests.assign
        ASIGNAR: municipal.requests.assignUser
        ESPERAR_CIUDADANO: municipal.requests.update
        REANUDAR: municipal.requests.update
        CERRAR: municipal.requests.close
        CANCELAR: municipal.requests.cancel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Transition' }
      responses:
        '200':
          description: OK (nueva versión en ETag)
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Request' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Transición inválida (INVALID_TRANSITION) o versión obsoleta (CONFLICT)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /municipalities/{mun}/requests/{folio}/grants:
    parameters:
      - { $ref: '#/components/parameters/Mun' }
      - { $ref: '#/components/parameters/Folio' }
    post:
      summary: Compartir expediente con un usuario o dependencia
      operationId: createGrant
      x-rq: [RQ03]
      x-permission: municipal.requests.grant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantCreate' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Grant' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /municipalities/{mun}/requests/{folio}/grants/{grantId}:
    parameters:
      - { $ref: '#/components/parameters/Mun' }
      - { $ref: '#/components/parameters/Folio' }
      - { name: grantId, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
    delete:
      summary: Revocar concesión (efecto inmediato)
      operationId: revokeGrant
      x-rq: [RQ03]
      x-permission: municipal.requests.grant
      responses:
        '204': { description: Revocado }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /municipalities/{mun}/requests/{folio}/history:
    parameters:
      - { $ref: '#/components/parameters/Mun' }
      - { $ref: '#/components/parameters/Folio' }
    get:
      summary: Historial de seguimiento (actor, fecha, estado de origen y destino)
      operationId: getRequestHistory
      x-rq: [RQ02]
      x-permission: municipal.requests.read
      description: No disponible para alcance META (auditor usa listAuditEvents).
      responses:
        '200':
          description: OK, en orden cronológico
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /municipalities/{mun}/requests/{folio}/receipt:
    parameters:
      - { $ref: '#/components/parameters/Mun' }
      - { $ref: '#/components/parameters/Folio' }
    get:
      summary: Acuse imprimible para el ciudadano (canal presencial)
      operationId: getRequestReceipt
      x-rq: [RQ06]
      x-permission: municipal.requests.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Receipt' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /municipalities/{mun}/requests/{folio}/documents:
    parameters:
      - { $ref: '#/components/parameters/Mun' }
      - { $ref: '#/components/parameters/Folio' }
    get:
      summary: Listar documentos del expediente
      operationId: listDocuments
      x-rq: [RQ05]
      x-permission: municipal.documents.read
      description: Los documentos más restrictivos que el alcance del usuario aparecen como `restricted` sin nombre ni tamaño.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/Document'
                            - $ref: '#/components/schemas/RestrictedDocument'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      summary: Adjuntar documento privado (PDF, PNG o JPEG, ≤ 5 MB)
      operationId: uploadDocument
      x-rq: [RQ05]
      x-permission: municipal.documents.upload
      x-codex-dependency: C-07 (almacenamiento GridFS o externo; multipart requiere dependencia nueva)
      description: |
        Fase 1: contenido en base64 dentro de JSON (límite actual de express.json = 10 MB).
        El tipo se verifica por firma binaria; el nombre se sanea; el servidor calcula sha256.
        La confidencialidad efectiva nunca es menor que la del expediente.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentUpload' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Document' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Expediente concluido }
        '413':
          description: Archivo mayor a 5 MB
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /municipalities/{mun}/requests/{folio}/documents/{documentId}/content:
    parameters:
      - { $ref: '#/components/parameters/Mun' }
      - { $ref: '#/components/parameters/Folio' }
      - { name: documentId, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
    get:
      summary: Descarga autorizada de un documento privado
      operationId: downloadDocument
      x-rq: [RQ05]
      x-permission: municipal.documents.read
      description: |
        Nunca existe URL pública ni enlace reutilizable. Cada descarga y cada denegación quedan en bitácora.
        Fuera de alcance o más restrictivo que el usuario → 404 indistinguible.
      responses:
        '200':
          description: Contenido binario
          headers:
            Content-Disposition: { schema: { type: string }, description: 'attachment; filename=…' }
            Cache-Control: { schema: { const: no-store } }
            X-Content-Type-Options: { schema: { const: nosniff } }
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /municipalities/{mun}/indicators:
    parameters: [ { $ref: '#/components/parameters/Mun' } ]
    get:
      summary: Indicadores administrativos sobre los expedientes en alcance del usuario
      operationId: getIndicators
      x-rq: [RQ04]
      x-permission: municipal.indicators.read
      description: Usa el mismo filtro de alcance que listRequests; nunca revela conteos no autorizados.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time }, description: Exclusivo }
        - { name: dependency, in: query, schema: { $ref: '#/components/schemas/DependencyCode' } }
        - { name: slaDays, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 15 }, description: Parámetro configurable, no plazo legal }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Indicators' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /municipalities/{mun}/folios/{folio}:
    parameters:
      - { $ref: '#/components/parameters/Mun' }
      - { $ref: '#/components/parameters/Folio' }
    get:
      summary: Verificar un folio (metadatos mínimos)
      operationId: verifyFolio
      x-rq: [RQ01]
      x-permission: municipal.requests.read
      description: Mismo alcance que getRequest; devuelve solo FolioInfo.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/FolioInfo' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /municipalities/{mun}/audit-events:
    parameters: [ { $ref: '#/components/parameters/Mun' } ]
    get:
      summary: Consultar bitácora (solo lectura)
      operationId: listAuditEvents
      x-rq: [RQ02, RQ05]
      x-permission: municipal.audit.read
      parameters:
        - { name: entityId, in: query, schema: { $ref: '#/components/schemas/ObjectId' } }
        - { name: folio, in: query, schema: { $ref: '#/components/schemas/Folio' } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK (más reciente primero)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
                      pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    Mun:
      name: mun
      in: path
      required: true
      description: Código del municipio (p. ej. SJH). Nunca se toma del cuerpo.
      schema: { type: string, pattern: '^[A-Z]{3}$' }
    DepCode:
      name: code
      in: path
      required: true
      schema: { $ref: '#/components/schemas/DependencyCode' }
    Folio:
      name: folio
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Folio' }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }

  responses:
    BadRequest:
      description: Validación fallida o campo no permitido
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Token ausente, inválido, expirado, sesión revocada o usuario inactivo
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Sin membresía vigente o sin el permiso municipal requerido
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: No existe o está fuera del alcance del usuario (indistinguible)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ServiceUnavailable:
      description: La autorización central no está disponible (falla cerrada)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotImplemented:
      description: Operación del contrato pendiente de su historia (ver x-pending-story)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Duplicado, idempotencia con otro cuerpo o versión obsoleta
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Ok:
      type: object
      required: [success]
      properties: { success: { const: true } }
    Error:
      type: object
      required: [success, error, code]
      properties:
        success: { const: false }
        error: { type: string }
        code:
          type: string
          enum: [VALIDATION_ERROR, UNAUTHORIZED, MUNICIPAL_MEMBERSHIP_REQUIRED, FORBIDDEN, NOT_FOUND, CONFLICT, INVALID_TRANSITION, PAYLOAD_TOO_LARGE, AUTHORIZATION_UNAVAILABLE, NOT_IMPLEMENTED, INTERNAL_ERROR]
        fields: { type: array, items: { type: string }, description: Campos rechazados (solo VALIDATION_ERROR) }
    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        pages: { type: integer }
    ObjectId: { type: string, pattern: '^[a-f0-9]{24}$' }
    ActiveStatus: { type: string, enum: [ACTIVA, INACTIVA] }
    DependencyCode: { type: string, pattern: '^[A-Z]{3}$' }
    Folio:
      type: string
      description: '{MUN}-{DEP}-{TIPO}-{AAAA}-{NNNNNN}; único por municipio; nunca reutilizado'
      pattern: '^[A-Z]{3}-[A-Z]{3}-[A-Z]{3}-\d{4}-\d{6}$'
      examples: [SJH-OBP-SOL-2026-000042]
    MunicipalRole:
      type: string
      enum: [ADMIN_MUNICIPAL, SUPERVISOR_MUNICIPAL, TITULAR_DEPENDENCIA, OPERADOR_DEPENDENCIA, VENTANILLA, AUDITOR_MUNICIPAL, CONSULTA]
    RequestStatus:
      type: string
      enum: [REGISTRADA, EN_TRAMITE, EN_ESPERA_CIUDADANO, CERRADA, CANCELADA]
    Confidentiality: { type: string, enum: [PUBLICA, RESERVADA, CONFIDENCIAL], default: PUBLICA }
    Channel:
      type: string
      enum: [PRESENCIAL, TELEFONO, WEB_FUNCIONARIO]
      description: Canal de atención (RQ06). La ventanilla registra en nombre del ciudadano.
    RequestType:
      type: string
      enum: [SOL]
      description: Fase 1 solo solicitud genérica; nuevos tipos se agregan por versión menor.

    MyMembership:
      type: object
      required: [id, municipality, role, dependencies, permissions]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        municipality:
          type: object
          properties:
            code: { type: string }
            name: { type: string }
        role: { $ref: '#/components/schemas/MunicipalRole' }
        dependencies: { type: array, items: { $ref: '#/components/schemas/DependencyCode' } }
        permissions:
          type: array
          description: Solo para UX; el servidor recalcula en cada petición.
          items: { type: string, pattern: '^municipal\.' }
        validTo: { type: [string, 'null'], format: date-time }

    Dependency:
      type: object
      required: [code, name, status]
      properties:
        code: { $ref: '#/components/schemas/DependencyCode' }
        name: { type: string }
        parentCode: { oneOf: [ { $ref: '#/components/schemas/DependencyCode' }, { type: 'null' } ] }
        status: { $ref: '#/components/schemas/ActiveStatus' }
    DependencyCreate:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: { $ref: '#/components/schemas/DependencyCode' }
        name: { type: string, minLength: 3, maxLength: 150 }
        parentCode: { $ref: '#/components/schemas/DependencyCode' }
    DependencyUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 3, maxLength: 150 }
        status: { $ref: '#/components/schemas/ActiveStatus' }

    MembershipCreate:
      type: object
      additionalProperties: false
      required: [userId, role, dependencies]
      properties:
        userId: { $ref: '#/components/schemas/ObjectId' }
        role: { $ref: '#/components/schemas/MunicipalRole' }
        dependencies: { type: array, maxItems: 20, uniqueItems: true, items: { $ref: '#/components/schemas/DependencyCode' } }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
    MembershipUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: { $ref: '#/components/schemas/MunicipalRole' }
        dependencies: { type: array, maxItems: 20, uniqueItems: true, items: { $ref: '#/components/schemas/DependencyCode' } }
        validTo: { type: [string, 'null'], format: date-time }
        status: { $ref: '#/components/schemas/ActiveStatus' }

    CitizenCreate:
      type: object
      additionalProperties: false
      required: [fullName]
      description: Datos mínimos. No se aceptan CURP, INE, RFC ni fecha de nacimiento en Fase 1.
      properties:
        fullName: { type: string, minLength: 3, maxLength: 200 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, pattern: '^[0-9 +()-]{7,20}$' }
        locality: { type: string, maxLength: 120 }
    Citizen:
      type: object
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        fullName: { type: string }
        email: { type: string }
        phone: { type: string }
        locality: { type: string }

    RequestCreate:
      type: object
      additionalProperties: false
      required: [type, ownerDependency, subject, citizenId, channel]
      properties:
        type: { $ref: '#/components/schemas/RequestType' }
        ownerDependency: { $ref: '#/components/schemas/DependencyCode' }
        subject: { type: string, minLength: 5, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        citizenId: { $ref: '#/components/schemas/ObjectId' }
        confidentiality: { $ref: '#/components/schemas/Confidentiality' }
        channel: { $ref: '#/components/schemas/Channel' }
    RequestUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        subject: { type: string, minLength: 5, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        confidentiality: { $ref: '#/components/schemas/Confidentiality' }
    RequestSummary:
      type: object
      required: [folio, type, status, ownerDependency, createdAt]
      properties:
        folio: { $ref: '#/components/schemas/Folio' }
        type: { $ref: '#/components/schemas/RequestType' }
        status: { $ref: '#/components/schemas/RequestStatus' }
        ownerDependency: { $ref: '#/components/schemas/DependencyCode' }
        assignedDependencies: { type: array, items: { $ref: '#/components/schemas/DependencyCode' } }
        confidentiality: { $ref: '#/components/schemas/Confidentiality' }
        channel: { $ref: '#/components/schemas/Channel' }
        subject: { type: string, description: Presente en listados salvo alcance META (auditor) }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Request:
      allOf:
        - $ref: '#/components/schemas/RequestSummary'
        - type: object
          properties:
            subject: { type: string }
            description: { type: string }
            citizen: { $ref: '#/components/schemas/Citizen' }
            assignedUserId: { oneOf: [ { $ref: '#/components/schemas/ObjectId' }, { type: 'null' } ] }
            version: { type: integer }
            history:
              type: array
              items: { $ref: '#/components/schemas/HistoryEntry' }
    Transition:
      type: object
      additionalProperties: false
      required: [action, version]
      properties:
        action: { type: string, enum: [TURNAR, ASIGNAR, ESPERAR_CIUDADANO, REANUDAR, CERRAR, CANCELAR] }
        version: { type: integer, minimum: 0 }
        toDependencies: { type: array, minItems: 1, maxItems: 10, uniqueItems: true, items: { $ref: '#/components/schemas/DependencyCode' }, description: Obligatorio en TURNAR }
        assignedUserId: { $ref: '#/components/schemas/ObjectId', description: Obligatorio en ASIGNAR }
        note: { type: string, maxLength: 2000, description: Obligatorio en CERRAR y CANCELAR }
    GrantCreate:
      type: object
      additionalProperties: false
      required: [level]
      oneOf:
        - required: [granteeUserId]
        - required: [granteeDependency]
      properties:
        granteeUserId: { $ref: '#/components/schemas/ObjectId' }
        granteeDependency: { $ref: '#/components/schemas/DependencyCode' }
        level: { type: string, enum: [READ, CONTRIBUTE] }
        expiresAt: { type: string, format: date-time }
    HistoryEntry:
      type: object
      required: [at, actorId, action, toStatus]
      properties:
        at: { type: string, format: date-time }
        actorId: { $ref: '#/components/schemas/ObjectId' }
        action: { type: string, enum: [REGISTRAR, EDITAR, TURNAR, ASIGNAR, ESPERAR_CIUDADANO, REANUDAR, CERRAR, CANCELAR] }
        fromStatus: { oneOf: [ { $ref: '#/components/schemas/RequestStatus' }, { type: 'null' } ] }
        toStatus: { $ref: '#/components/schemas/RequestStatus' }
        assignedUserId: { $ref: '#/components/schemas/ObjectId' }
        toDependencies: { type: array, items: { $ref: '#/components/schemas/DependencyCode' } }
        note: { type: string }
        fields: { type: array, items: { type: string }, description: Campos editados (acción EDITAR) }
    Receipt:
      type: object
      required: [folio, municipality, dependency, subject, status, statusLabel, channel, registeredAt]
      description: Sin datos de contacto, descripción ni documentos.
      properties:
        folio: { $ref: '#/components/schemas/Folio' }
        municipality: { type: string }
        dependency: { type: string }
        subject: { type: string }
        status: { $ref: '#/components/schemas/RequestStatus' }
        statusLabel: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        registeredAt: { type: string, format: date-time }
        instructions: { type: string }
    DocumentUpload:
      type: object
      additionalProperties: false
      required: [filename, mimeType, contentBase64]
      properties:
        filename: { type: string, maxLength: 200 }
        mimeType: { type: string, enum: [application/pdf, image/png, image/jpeg] }
        contentBase64: { type: string, contentEncoding: base64, maxLength: 6990508 }
        confidentiality: { $ref: '#/components/schemas/Confidentiality' }
    Document:
      type: object
      required: [id, filename, mimeType, size, sha256, confidentiality, uploadedAt]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        folio: { $ref: '#/components/schemas/Folio' }
        filename: { type: string }
        mimeType: { type: string }
        size: { type: integer, maximum: 5242880 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        confidentiality: { $ref: '#/components/schemas/Confidentiality' }
        uploadedBy: { $ref: '#/components/schemas/ObjectId' }
        uploadedAt: { type: string, format: date-time }
    RestrictedDocument:
      type: object
      required: [id, confidentiality, restricted]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        confidentiality: { $ref: '#/components/schemas/Confidentiality' }
        restricted: { const: true }
    Indicators:
      type: object
      required: [period, slaDays, total, open, registeredInPeriod, closedInPeriod, avgResolutionDays, overdueOpen, byStatus, byDependency, byChannel]
      properties:
        period:
          type: object
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        slaDays: { type: integer }
        total: { type: integer }
        open: { type: integer }
        registeredInPeriod: { type: integer }
        closedInPeriod: { type: integer }
        avgResolutionDays: { type: [number, 'null'] }
        overdueOpen: { type: integer }
        byStatus: { type: object, additionalProperties: { type: integer } }
        byDependency: { type: object, additionalProperties: { type: integer } }
        byChannel: { type: object, additionalProperties: { type: integer } }
    Grant:
      type: object
      required: [id, folio, level, expiresAt]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        folio: { $ref: '#/components/schemas/Folio' }
        granteeUserId: { $ref: '#/components/schemas/ObjectId' }
        granteeDependency: { $ref: '#/components/schemas/DependencyCode' }
        level: { type: string, enum: [READ, CONTRIBUTE] }
        expiresAt: { type: [string, 'null'], format: date-time }
    AuditEvent:
      type: object
      required: [at, actorId, action, entity, result]
      properties:
        at: { type: string, format: date-time }
        actorId: { $ref: '#/components/schemas/ObjectId' }
        action: { type: string }
        entity: { type: string, enum: [Request, Document, Citizen, Grant] }
        entityId: { $ref: '#/components/schemas/ObjectId' }
        folio: { $ref: '#/components/schemas/Folio' }
        result: { type: string, enum: [success, denied] }
        ip: { type: string }
        requestId: { type: string }
    FolioInfo:
      type: object
      required: [folio, type, ownerDependency, year, sequence, status]
      properties:
        folio: { $ref: '#/components/schemas/Folio' }
        type: { $ref: '#/components/schemas/RequestType' }
        ownerDependency: { $ref: '#/components/schemas/DependencyCode' }
        year: { type: integer }
        sequence: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/RequestStatus' }
        createdAt: { type: string, format: date-time }
