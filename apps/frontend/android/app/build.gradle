apply plugin: 'com.android.application'
apply plugin: 'com.facebook.react'

react {
    root = file('../..')
    reactNativeDir = file('../../../../node_modules/react-native')
    codegenDir = file('../../../../node_modules/@react-native/codegen')
    cliFile = file('../../../../node_modules/react-native/cli.js')
    entryFile = file('../../index.js')
}
android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion
    namespace 'com.yjnexo'
    defaultConfig {
        applicationId 'com.yjnexo'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '1.0'
    }
    // AGP generates the standard local debug key; no keystore is versioned.
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}
dependencies {
    implementation('com.facebook.react:react-android')
    if (hermesEnabled.toBoolean()) implementation('com.facebook.react:hermes-android')
    else implementation 'org.webkit:android-jsc:+'
}
apply from: file('../../../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle'); applyNativeModulesAppBuildGradle(project)
